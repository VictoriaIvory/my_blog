{% extends 'base.html' %}

{% block title %}页面走丢了 · 我的博客{% endblock %}

{% block content %}
<div class="not-found">
  <p class="not-found-code">404</p>
  <h1>这个页面走丢了</h1>
  <p class="not-found-desc">可能是链接写错了，也可能是文章被删了。</p>

  <form class="search not-found-search" method="get" action="{% url 'blog:list' %}">
    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <input type="search" name="q" placeholder="或者直接搜一篇文章…" aria-label="搜索文章">
    <button type="submit">搜索</button>
  </form>

  <div class="not-found-actions">
    <a class="btn-primary" href="{% url 'blog:list' %}">回首页看看</a>
    <a class="btn-ghost" href="/admin/" target="_blank" rel="noopener">去后台写文章</a>
  </div>
</div>
{% endblock %}
